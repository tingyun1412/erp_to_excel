[server]
# 只監聽本機（127.0.0.1），不要監聽 0.0.0.0——後者會讓同一個網路上的其他電腦
# 也能直接連進來看到這個 App（含客戶資料、廠商密碼等），這支 App 沒有登入機制，
# 所以一定要限制成只有這台電腦自己能連。
address = "127.0.0.1"

# 程式放在公司網路碟（UNC 路徑）上執行時，Streamlit 預設的檔案監控（存檔自動重整）
# 會去掃整個資料夾樹一輪，SMB 網路磁碟每個檔案操作都比本機慢很多，掃描會拖很久
# 甚至看起來像卡死。這支 App 不需要「改程式碼自動重整」這個開發用功能，直接關掉。
fileWatcherType = "none"

[browser]
gatherUsageStats = false
